    <style>
        * {
            margin: 1px;
            padding: 0;
            box-sizing: border-box;
            border-radius: 5px;
            
        }



        main {
            background: linear-gradient(110deg,
                    #581747 0%,
                    #41164F 25%,
                    #2D1754 50%,
                    #1B1244 75%,
                    #0D0B24 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;

            padding: 70px;
            gap: 50px;
        }

        .logo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 35px;
        }


        nav {
            display: flex;
            justify-content: space-between;

        }

        nav h1 {
            color: #FFFFFF;
            font-size: 20px;
            font-weight: 600px;
            font-family: 'Poppins', sans-serif;
            padding-left: 20px;
            margin-top: 0px;
            text-shadow: 0px 8px 3px rgba(7, 7, 7, 0.288);
        }

        nav button {
            background: linear-gradient(135deg,
                    #765D7A 0%,
                    #655571 50%,
                    #554565 100%);
            border: 1px solid purple;
            color: white;
            padding: 5px 20px;
            text-align: center;
            font-size: 16px;
            cursor: pointer;
            border-radius: 18px;
        }

        section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 80px;
            margin-right: 10px;
        }






        .card {
            background: linear-gradient(135deg,
                    #765D7A 0%,
                    #655571 50%,
                    #554565 100%);
            height: 300px;
            width: 250px;
            display: flex column;

            border-radius: 22px;
            color: #FFFFFF;
            margin-top: 0px;
            display: flex column;


        }

        .image {
            padding: 15px;
            border-radius: 22px;
        }



        .image img {
            border-radius: 22px;
            border: 2px solid #FFFFFF;
        }

        .word {

            font-size: 18px;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            text-shadow: 0px 8px 3px rgba(7, 7, 7, 0.288);
        }



        .word span:first-child {
            padding-left: 20px;
            padding-top: 0
        }

        .card .word span:nth-child(2) {
            padding-left: 30px;
        }

        .word span:last-child {
            padding-left: 0px;
        }

        .button {
            background: linear-gradient(135deg,
                    #765D7A 0%,
                    #655571 50%,
                    #554565 100%);
            border: 1px solid purple;
            color: white;
            padding: 5px 20px;
            text-align: center;
            font-size: 16px;
            margin: 10px 65px;
            cursor: pointer;
            border-radius: 18px;
        }
    </style>
